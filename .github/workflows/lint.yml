name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Include the streamlit extra so mypy type-checks app.py /
      # streamlit_viz.py against the REAL streamlit + plotly types rather
      # than the Any-typed fallback (issue #374): without it CI's mypy stays
      # green while the documented local gate fails on real type errors.
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,streamlit]"

      # Full config: CI now runs ruff's complete pyproject.toml ruleset
      # (E, F, W, I, N, UP) with no --select override, completing the
      # incremental widening tracked in issue #87. The scientific-naming
      # codes that clash with composite-mechanics notation (N802/803/806/
      # 815/816) are documented ignores in pyproject's [tool.ruff.lint].
      - name: Ruff (full pyproject config)
        run: ruff check .

      # Whole-tree mypy: the src/wrinklefe package plus the repo-root
      # Streamlit entry points (app.py, streamlit_viz.py). Completes the
      # mypy-coverage walk tracked as a follow-up to issue #87; streamlit
      # and plotly are unstubbed and ignored via pyproject [tool.mypy].
      - name: Mypy (whole tree)
        run: mypy src/wrinklefe app.py streamlit_viz.py

  citation:
    # CITATION.cff is what GitHub's "Cite this repository" button and
    # (once archiving is enabled) Zenodo read. A malformed file degrades
    # silently — the button just stops offering BibTeX — so validate it
    # against the CFF 1.2.0 schema on every PR (issue #284).
    #
    # Its own job, not a step in `lint`, because cffconvert pulls an
    # unrelated dependency tree (jsonschema, pykwalify, ruamel.yaml) that
    # has no business in the environment ruff and mypy run against.
    # tests/test_version.py separately locks the *value* of `version:` to
    # pyproject.toml; this checks the file is well-formed.
    name: Validate CITATION.cff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install cffconvert
        run: |
          python -m pip install --upgrade pip
          pip install cffconvert

      - name: Validate against the CFF schema
        run: cffconvert --validate
