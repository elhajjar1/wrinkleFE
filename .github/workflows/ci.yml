name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Note: Windows is intentionally not in the matrix. The desktop build
      # pipeline (PyInstaller spec + build-windows.yml) was removed in #121;
      # releases are now source-only (PyPI / source tarball). See issue #10.
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      # The matrix runs only the fast lane (`-m "not slow"`): the slow
      # FE/CZM integration solves would multiply the 6-cell wall-time for
      # little marginal signal. The complete suite (and the Codecov
      # upload, which needs the slow-path coverage) runs once in
      # ``test-full`` below.
      #
      # `--cov-fail-under=0` explicitly opts this job OUT of the
      # `fail_under` floor in pyproject's [tool.coverage.report]. The
      # floor was measured on the FULL suite; this lane deselects the slow
      # integration solves, so its coverage is structurally lower and
      # would trip a floor that is perfectly healthy. ``test-full`` is the
      # job the floor is meant to gate. The `--cov` here stays only for
      # the per-cell terminal report.
      - name: Run tests
        run: pytest --tb=short -q -m "not slow" --cov=wrinklefe --cov-report=xml --cov-report=term --cov-fail-under=0

      - name: Check import
        run: python -c "import wrinklefe; print(f'WrinkleFE {wrinklefe.__version__} imported successfully')"

  test-full:
    # Complete suite on a single interpreter, including the slow FE/CZM
    # integration solves the matrix job skips. `-m "not benchmark"` runs
    # everything except the pytest-benchmark performance suite (the
    # default addopts already exclude it, but an explicit -m on the CLI
    # overrides that default, so it is restated here). This is the job
    # that owns the Codecov upload — measuring coverage on the fast lane
    # alone would under-report the slow integration paths. It is also the
    # job the `fail_under` floor in pyproject's [tool.coverage.report]
    # gates: this run's number is the one the floor was measured against,
    # so no `--cov-fail-under` override appears below (unlike the matrix
    # job above, which opts out).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run full test suite
        run: pytest --tb=short -q -m "not benchmark" --cov=wrinklefe --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  doctests:
    # Executes the `>>>` docstring examples across src/wrinklefe so a drift
    # between the documented output and real behaviour fails CI. Kept as a
    # dedicated job (not folded into `test`) so a doc example can never block
    # the core unit-test suite — `--doctest-modules` is deliberately absent
    # from the default addopts. Examples that need a heavy object (generated
    # mesh, full FE solve) are marked `# doctest: +SKIP`; see CONTRIBUTING.md.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run doctests
        run: pytest --doctest-modules src/wrinklefe -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install with docs extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[docs]"

      # -W turns warnings (broken cross-references, bad docstring
      # syntax, stale autodoc targets) into build failures.
      - name: Build docs
        run: sphinx-build -W docs docs/_build

  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      # Minimal supported install — the examples must work without extras.
      - name: Install (minimal)
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run example scripts
        env:
          MPLBACKEND: Agg
        working-directory: examples
        run: |
          for f in *.py; do
            echo "::group::$f"
            python "$f"
            echo "::endgroup::"
          done

  build:
    # Packaging gate on every PR (issue #264). Before this job existed the
    # first time anyone found out `python -m build` was broken — a bad
    # classifier, a missing `py.typed` (#202), a MANIFEST.in typo — was at
    # upload time, by hand, mid-release.
    #
    # It also owns the sdist-content guard. The sdist used to carry the
    # whole `figures/` tree (~17.6 MB of PNGs) because a stray
    # `setuptools-scm` in [build-system].requires installed a git
    # file-finder into the build env; MANIFEST.in now declares the contents
    # explicitly and `scripts/check_sdist_contents.sh` fails the build if a
    # rendered output or repo-only directory ever reappears in the tarball.
    # The identical three steps run again in release.yml before publishing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      # Validates the rendered README (PyPI's long-description renderer is
      # stricter than GitHub's) and the wheel/sdist metadata.
      - name: twine check
        run: twine check dist/*

      - name: Guard sdist contents
        run: bash scripts/check_sdist_contents.sh dist

      - name: Report artifact sizes
        run: ls -l dist

  benchmarks:
    # Runs the pytest-benchmark performance suite, autosaves the timings
    # as a build artifact, and compares them against the committed
    # baseline in `tests/test_benchmarks/baseline/`. That baseline is
    # currently container-generated and the compare step is therefore on
    # `continue-on-error` probation — see the step comments below and the
    # "Benchmarks" section of CONTRIBUTING.md for how to promote it to a
    # blocking gate. The 2x (median:100%) threshold absorbs the
    # substantial run-to-run CPU variance of shared CI runners; a tighter
    # bound (e.g. 50%) would flake.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run benchmarks (autosave)
        run: |
          pytest tests/test_benchmarks -m benchmark \
            --benchmark-autosave --benchmark-storage=.benchmarks

      # `.benchmarks/` is a DOT directory, and upload-artifact@v4 skips
      # hidden files by default — so every previous run logged "No files
      # were found with the provided path" and silently uploaded nothing.
      # That is why no runner-generated baseline was ever downloadable.
      - name: Upload benchmark timings
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-timings
          path: .benchmarks/
          include-hidden-files: true
          if-no-files-found: warn

      # PROBATION — non-blocking. The committed baseline under
      # tests/test_benchmarks/baseline/ is *container-generated* (produced
      # on Python 3.12, so its machine id matches this job, but on
      # different hardware from a GitHub runner). Absolute timings
      # therefore are not comparable, and a hard failure here would be
      # noise, not signal. It runs and reports so the gate is visible and
      # exercised. Before dropping `continue-on-error` and making this
      # blocking: download the `benchmark-timings` artifact from a green
      # `main` run (now that the upload above is fixed) and replace the
      # baseline per the "Benchmarks" section of CONTRIBUTING.md.
      - name: Compare against committed baseline (if present)
        continue-on-error: true
        run: |
          if [ -d tests/test_benchmarks/baseline ]; then
            echo "Baseline found — reporting median:100% (2x) regression gate."
            pytest tests/test_benchmarks -m benchmark \
              --benchmark-storage=tests/test_benchmarks/baseline \
              --benchmark-compare \
              --benchmark-compare-fail=median:100%
          else
            echo "No baseline at tests/test_benchmarks/baseline — regression gate skipped."
          fi
